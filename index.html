<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តេស្តនិយាយភាសាកូរ៉េ — ខែតុលា</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+Khmer:wght@300;400;600;700&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0f172a; --paper:#f8fafc; --paper2:#f1f5f9; --accent:#dc2626; --accent2:#f97316; --muted:#64748b; --green:#16a34a; --border:#e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Noto Sans Khmer','Noto Serif KR',serif; background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%); color:var(--ink); min-height:100vh; padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
    header { background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); color:var(--paper); padding:20px 16px; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--border); width:100%; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    header h1 { font-family:'Playfair Display',serif; font-size:22px; font-style:italic; letter-spacing:.02em; }
    header span { font-family:'DM Mono',monospace; font-size:12px; color:var(--muted); letter-spacing:.1em; }
    .progress-bar { height:2px; background:var(--border); }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2),var(--green)); transition:width .5s ease; }
    .container { max-width:800px; margin:0 auto; padding:32px 24px; }
    .question-card { background:white; border:1px solid var(--border); border-radius:12px; padding:32px 36px; box-shadow:0 2px 8px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04); margin-bottom:28px; animation:slideIn .35s ease; }
    @keyframes slideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .q-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .q-tag { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.12em; color:white; text-transform:uppercase; background:linear-gradient(135deg,var(--accent),#e11d48); padding:4px 12px; border-radius:6px; font-weight:600; }
    .q-counter { font-family:'DM Mono',monospace; font-size:12px; color:var(--muted); }
    .q-prompt { font-size:19px; font-weight:600; line-height:1.5; margin-bottom:12px; color:var(--ink); }
    .q-khmer { font-size:14px; color:var(--muted); margin-bottom:8px; }
    .q-pattern { font-size:13px; color:var(--muted); font-style:italic; border-left:2px solid var(--border); padding-left:10px; margin-bottom:8px; }
    .q-images { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
    .q-images figure { flex:0 1 150px; max-width:150px; margin:0; text-align:center; }
    .q-images.single figure { flex:0 1 180px; max-width:180px; }
    .q-images img { width:100%; height:120px; object-fit:contain; background:#fff; padding:4px; border-radius:8px; border:1px solid var(--border); display:block; }
    .q-images.single img { height:150px; }
    .q-images figcaption { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--muted); margin-top:4px; }
    .q-hint { background:#f0f9ff; border:1px solid #bfdbfe; border-radius:8px; padding:14px 16px; margin-top:16px; font-size:14px; line-height:1.6; }
    .q-hint .label, .model-answer-reveal .label, .self-check .label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
    .controls { display:flex; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
    .btn-record { display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,var(--accent),#e11d48); color:white; border:none; padding:12px 24px; font-family:'Noto Sans Khmer',serif; font-size:15px; font-weight:600; cursor:pointer; border-radius:8px; transition:all .3s; box-shadow:0 2px 8px rgba(220,38,38,.2); }
    .btn-record:hover { background:linear-gradient(135deg,#b91c1c,#be123c); transform:translateY(-2px); box-shadow:0 4px 12px rgba(220,38,38,.3); }
    .btn-record.recording { background:var(--green); animation:pulse 1.2s infinite; }
    .btn-record.recording:hover { background:#229954; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.4)} 50%{box-shadow:0 0 0 8px rgba(39,174,96,0)} }
    .dot { width:10px; height:10px; background:white; border-radius:50%; flex-shrink:0; }
    .btn-record.recording .dot { border-radius:2px; }
    .timer { font-family:'DM Mono',monospace; font-size:22px; font-weight:300; color:var(--ink); min-width:60px; letter-spacing:.05em; }
    .waveform { display:flex; align-items:center; gap:3px; height:30px; opacity:0; transition:opacity .3s; }
    .waveform.active { opacity:1; }
    .waveform-bar { width:3px; background:var(--accent); border-radius:2px; animation:wave .8s ease-in-out infinite; min-height:4px; }
    @keyframes wave { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }
    .answer-section { display:none; }
    .answer-section.visible { display:block; animation:slideIn .3s ease; }
    .audio-player-custom { background:white; border:1px solid var(--border); border-radius:8px; padding:12px 16px; display:flex; align-items:center; gap:12px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .audio-play-btn { width:36px; height:36px; border-radius:50%; background:var(--ink); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; box-shadow:0 2px 4px rgba(0,0,0,.1); }
    .audio-play-btn:hover { background:var(--accent); transform:scale(1.05); }
    .audio-play-btn svg { fill:white; }
    .audio-progress-wrap { flex:1; height:4px; background:var(--border); border-radius:2px; cursor:pointer; position:relative; }
    .audio-progress-fill { height:100%; background:var(--accent); border-radius:2px; width:0%; transition:width .1s linear; }
    .audio-time { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); min-width:40px; text-align:right; }
    audio { display:none; }
    .fixed-controls { position:fixed; bottom:0; left:0; width:100%; display:flex; justify-content:center; align-items:center; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:white; border-top:1px solid #ddd; box-shadow:0 -2px 8px rgba(0,0,0,.08); z-index:1000; }
    .fixed-controls .btn-nav { flex:0 1 auto; white-space:nowrap; }
    .fixed-controls button { padding:10px 20px; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
    .btn-check { width:100%; background:linear-gradient(135deg,var(--green),#15803d); color:white; border:none; padding:14px 16px; font-family:'Noto Sans Khmer',serif; font-size:15px; font-weight:600; cursor:pointer; border-radius:8px; transition:all .3s; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 2px 8px rgba(22,163,74,.2); }
    .btn-check:hover { background:linear-gradient(135deg,#15803d,#166534); transform:translateY(-2px); }
    .btn-check.speaking { background:var(--accent2); animation:pulse 1.2s infinite; }
    .btn-check:disabled { opacity:.5; cursor:not-allowed; }
    .model-answer-reveal { background:#ecfdf5; border:1px solid #d1fae5; border-left:4px solid var(--green); border-radius:8px; padding:16px 20px; margin-bottom:16px; animation:slideIn .3s ease; }
    .model-answer-reveal .label { margin-bottom:8px; }
    .model-answer-reveal #model-answer-text { font-size:18px; font-weight:700; color:var(--ink); line-height:1.6; }
    .model-answer-reveal #khmer-answer-text { font-size:14px; color:var(--muted); margin-top:4px; }
    .nav-row { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-top:8px; }
    .btn-nav { background:white; border:1px solid var(--border); color:var(--ink); padding:10px 20px; font-family:'Noto Sans Khmer',serif; font-size:14px; font-weight:600; cursor:pointer; border-radius:8px; transition:all .2s; flex:1; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .btn-nav:hover { background:var(--paper2); border-color:var(--muted); transform:translateY(-1px); }
    .btn-nav:disabled { opacity:.4; cursor:not-allowed; }
    .btn-nav.primary { background:linear-gradient(135deg,var(--ink),#1e293b); color:white; border-color:transparent; }
    .btn-nav.primary:hover { background:linear-gradient(135deg,#1e293b,#334155); }
    .mode-selector { display:flex; flex-wrap:nowrap; gap:8px; margin-bottom:18px; padding:8px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 4px 14px rgba(15,23,42,.05); overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
    .mode-btn { flex:0 0 auto; min-width:max-content; min-height:36px; padding:7px 13px; border:1px solid var(--border); background:#f8fafc; font-family:'Noto Sans Khmer',serif; font-size:12px; font-weight:600; cursor:pointer; color:#475569; transition:background .2s,color .2s,border-color .2s,transform .2s; border-radius:8px; white-space:nowrap; line-height:1.35; }
    .mode-btn.active { background:linear-gradient(135deg,var(--ink),#334155); color:#fff; border-color:var(--ink); box-shadow:0 3px 8px rgba(15,23,42,.16); }
    .mode-btn:hover:not(.active) { background:#eff6ff; color:var(--ink); border-color:#cbd5e1; transform:translateY(-1px); }
    .mode-btn:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
    @media (max-width:600px) {
      header { padding:18px 14px; gap:8px; }
      header h1 { font-size:19px; line-height:1.45; }
      header span { font-size:11px; }
      .container { padding:20px 12px; }
      .mode-selector { gap:6px; padding:7px; margin-bottom:14px; border-radius:10px; }
      .mode-btn { font-size:11px; padding:7px 11px; min-height:34px; }
      .question-card { padding:22px 16px; margin-bottom:18px; }
      .q-prompt { font-size:17px; }
      .controls { gap:12px; }
      .btn-record { padding:12px 16px; font-size:14px; }
      .nav-row { gap:8px; }
      .btn-nav { padding:11px 8px; font-size:12px; }
      .fixed-controls { gap:6px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
      .fixed-controls button { padding:10px 8px; font-size:12px; }
      .fixed-controls .btn-record { flex:1 1 auto; min-width:0; justify-content:center; gap:6px; padding:10px 6px; font-size:12px; }
      .fixed-controls .timer { min-width:42px; font-size:18px; }
      .fixed-controls .waveform { display:none; }
      .fixed-controls .btn-nav { flex:0 0 auto; padding:11px 9px; font-size:12px; }
    }
    @media (max-width:360px) {
      .mode-selector { gap:5px; padding:6px; }
      .mode-btn { font-size:10px; padding:7px 9px; }
    }
    .self-check { background:#fef3c7; border:1px solid #fde68a; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:14px; line-height:1.6; }
    .self-check .label { margin-bottom:8px; }
    .self-check-items { list-style:none; }
    .self-check-items li { display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; }
    .self-check-items li::before { content:'☐'; font-size:16px; line-height:1.2; color:var(--accent); flex-shrink:0; }
    .no-mic-msg { display:none; background:#fef3c7; border:1px solid #fde68a; color:#92400e; padding:12px 16px; font-size:13px; border-radius:8px; margin-bottom:16px; }
    .btn-speak { display:inline-flex; align-items:center; gap:7px; background:white; border:1.5px solid var(--accent2); color:var(--accent2); padding:8px 16px; font-family:'Noto Sans Khmer',serif; font-size:13px; font-weight:600; cursor:pointer; border-radius:6px; transition:all .2s; margin-top:12px; }
    .btn-speak:hover, .btn-speak.speaking { background:var(--accent2); color:white; }
    .date-badge { font-family:'DM Mono',monospace; font-size:11px; color:#94a3b8; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); padding:3px 10px; border-radius:4px; }
  </style>
</head>

<body>

  <header>
    <h1>តេស្តនិយាយភាសាកូរ៉េ — ខែតុលា</h1>
    <span class="date-badge">2026년 10월 26일</span>
  </header>
  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="container">

    <div class="mode-selector"></div>

    <div id="test-area">
      <div class="question-card" id="question-card">
        <div class="q-meta">
          <span class="q-tag" id="q-tag">Q01</span>
          <span class="q-counter" id="q-counter">1 / 30</span>
        </div>
        <div class="q-prompt" id="q-prompt">Loading...</div>
        <div class="q-khmer" id="q-khmer"></div>
        <div class="q-pattern" id="q-pattern"></div>
        <div class="q-images" id="q-images" style="display:none"></div>
        <button class="btn-speak" id="btn-speak" onclick="speakQuestion()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="speak-label">ស្តាប់សំណួរ</span>
        </button>
        <div class="q-hint" id="q-hint">
          <div class="label">ព័ត៌មានជំនួយ / Hint</div>
          <div id="q-hint-text"></div>
        </div>
      </div>

      <div class="no-mic-msg" id="no-mic-msg">
        ⚠️ មិនអាចចូលដំណើរការមីក្រូហ្វូនបានទេ។ សូមអនុញ្ញាតការចូលដំណើរការក្នុងការកំណត់របស់អ្នក។
      </div>

      <div class="fixed-controls">
        <button class="btn-record" id="record-btn" onclick="toggleRecord()">
          <div class="dot"></div>
          <span id="btn-label">ចាប់ផ្តើមថត</span>
        </button>
        <div class="timer" id="timer">0:00</div>
        <div class="waveform" id="waveform">
          <div class="waveform-bar" style="animation-delay:0s"></div>
          <div class="waveform-bar" style="animation-delay:0.1s"></div>
          <div class="waveform-bar" style="animation-delay:0.2s"></div>
          <div class="waveform-bar" style="animation-delay:0.15s"></div>
          <div class="waveform-bar" style="animation-delay:0.05s"></div>
          <div class="waveform-bar" style="animation-delay:0.25s"></div>
          <div class="waveform-bar" style="animation-delay:0.1s"></div>
        </div>
        <button class="btn-nav" id="back-btn" onclick="navigate(-1)">ថយក្រោយ</button>
        <button class="btn-nav primary" id="next-btn" onclick="navigate(1)">បន្ទាប់</button>
      </div>

      <div class="answer-section" id="answer-section">
        <div class="audio-player-custom" id="audio-player-custom">
          <button class="audio-play-btn" id="audio-play-btn" onclick="toggleAudioPlay()">
            <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24">
              <polygon points="5,3 19,12 5,21" />
            </svg>
          </button>
          <div class="audio-progress-wrap" id="audio-progress-wrap" onclick="seekAudio(event)">
            <div class="audio-progress-fill" id="audio-progress-fill"></div>
          </div>
          <div class="audio-time" id="audio-time">0:00</div>
        </div>
        <audio id="audio-playback"></audio>

        <div class="self-check" id="self-check" style="display:none">
          <div class="label">ពិនិត្យខ្លួនឯង / Self-check</div>
          <ul class="self-check-items" id="self-check-items"></ul>
        </div>

        <button class="btn-check" id="btn-check" onclick="speakAnswer()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="check-label">ស្តាប់ចម្លើយគំរូ</span>
        </button>

        <div class="model-answer-reveal" id="model-answer-box" style="display:none">
          <div class="label">ចម្លើយគំរូ / Model Answer</div>
          <div id="model-answer-text"></div>
          <div id="khmer-answer-text"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const QUESTIONS = [

      // ── PAGE 1: Q01–Q10 ──────────────────────────────────────────────
      {
        tag: 'Q01', pattern: 'V + 고 싶어요 / 왜요? → ~아/어서',
        prompt: '지민 씨, 어떤 생일 선물을 받고 싶어요? 왜요?',
        promptKhmer: 'តើអ្នកចង់បានអំណោយថ្ងៃកំណើតអ្វី? ហេតុអ្វី?',
        hint: '', answer: '저는 새 노트북을 받고 싶어요. 공부할 때 필요해요.',
        checks: ['받고 싶어요 = want to receive', '~할 때 = when ~', '필요해요 = need'],
        khmer: 'ខ្ញុំចង់បានកុំព្យូទ័រយួរដៃថ្មី។ ខ្ញុំត្រូវការវានៅពេលរៀន។'
      },
      {
        tag: 'Q02', pattern: 'V + 고 V (두 행동 이상)',
        prompt: '지민 씨, 자기 전에 보통 뭐 해요? (두 행동 이상 말해 주세요)',
        promptKhmer: 'មុនគេង អ្នកជាធម្មតាធ្វើអ្វី? (និយាយពីរសកម្មភាពឡើងទៅ)',
        hint: '', answer: '자기 전에 샤워하고 이를 닦고 휴대폰을 봐요.',
        checks: ['V + 고 = and (then)', '자기 전에 = before sleeping', '이를 닦다 = brush teeth'],
        khmer: 'មុនគេង ខ្ញុំងូតទឹក ដុសធ្មេញ ហើយមើលទូរស័ព្ទ។'
      },
      {
        tag: 'Q03', pattern: 'V/A + (으)면 어떤 점이 좋아요?',
        prompt: '프놈펜에 살면 어떤 점이 좋아요?',
        promptKhmer: 'បើរស់នៅភ្នំពេញ តើមានចំណុចល្អអ្វីខ្លះ?',
        hint: '', answer: '음식이 맛있고 물가가 싸요.',
        checks: ['점 = point / aspect', '맛있다 = delicious', '물가가 싸다 = prices are low'],
        khmer: 'អាហារឆ្ងាញ់ ហើយតម្លៃទំនិញថោក។'
      },
      {
        tag: 'Q04', pattern: 'N이/가 필요해요 / 왜요? → ~아/어서',
        prompt: '여행할 때 무엇이 필요해요? 왜 그것들이 필요해요?',
        promptKhmer: 'ពេលធ្វើដំណើរ តើត្រូវការអ្វី? ហេតុអ្វីត្រូវការវា?',
        hint: '', answer: '여권하고 돈이 필요해요. 외국에서 꼭 필요해요.',
        checks: ['여권 = passport', 'N하고 N = N and N', '꼭 = definitely'],
        khmer: 'ត្រូវការលិខិតឆ្លងដែន និងលុយ។ វាចាំបាច់នៅក្រៅប្រទេស។'
      },
      {
        tag: 'Q05', pattern: 'V + (으)ㄹ까요? → (으)ㄹ 거예요',

    const LABELS = {
      Q01: '생일 선물', Q02: '자기 전에', Q03: '프놈펜', Q04: '여행', Q05: '공항',
      Q06: '공부하다가', Q07: '전화', Q08: '인사', Q09: '주말', Q10: '듣기 수업',
      Q11: '길 묻기', Q12: '고 (2행동)'
    };

    const MODES = { all: QUESTIONS };
    Object.keys(LABELS).forEach(t => { MODES[t.toLowerCase()] = QUESTIONS.filter(q => q.tag === t); });

    document.querySelector('.mode-selector').innerHTML =
      '<button class="mode-btn active" data-mode="all">ទាំងអស់</button>' +
      Object.keys(LABELS).map(t => `<button class="mode-btn" data-mode="${t.toLowerCase()}">${t} ${LABELS[t]}</button>`).join('');

    let currentMode = 'all';
    let questions = [...QUESTIONS];
    let currentIndex = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let recordingInterval = null;
    let recordSeconds = 0;
    let isRecording = false;

    function getSupportedMimeType() {
      const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg'];
      for (const type of types) { if (MediaRecorder.isTypeSupported(type)) return type; }
      return '';
    }

    function setMode(mode) {
      currentMode = mode;
      questions = [...MODES[mode]];
      currentIndex = 0;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      resetQuestion();
      renderQuestion();
    }
    document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-tag').textContent = q.tag;
      document.getElementById('q-counter').textContent = `${currentIndex + 1} / ${questions.length}`;
      document.getElementById('q-prompt').textContent = q.prompt;
      document.getElementById('q-khmer').textContent = q.promptKhmer || '';
      document.getElementById('q-pattern').textContent = 'គំរូ: ' + q.pattern;
      const imgWrap = document.getElementById('q-images');
      if (q.images && q.images.length) {
        imgWrap.innerHTML = q.images.map(im => `<figure><img src="${im.src}" alt="${im.label}"><figcaption>${im.label}</figcaption></figure>`).join('');
        imgWrap.className = 'q-images' + (q.images.length === 1 ? ' single' : '');
        imgWrap.style.display = 'flex';
      } else {
        imgWrap.innerHTML = '';
        imgWrap.style.display = 'none';
      }
      document.getElementById('q-hint-text').textContent = q.answer;
      document.getElementById('model-answer-text').textContent = q.answer;
      document.getElementById('khmer-answer-text').textContent = q.khmer || '';
      document.getElementById('progress').style.width = ((currentIndex + 1) / questions.length * 100) + '%';
      document.getElementById('back-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
      resetQuestion();
    }

    function resetQuestion() {
      stopSpeech();
      silentStopRecording();
      stopAudio();
      document.getElementById('answer-section').classList.remove('visible');
      document.getElementById('model-answer-box').style.display = 'none';
      document.getElementById('self-check').style.display = 'none';
      document.getElementById('record-btn').className = 'btn-record';
      document.getElementById('btn-label').textContent = 'ចាប់ផ្តើមថត';
      document.getElementById('timer').textContent = '0:00';
      document.getElementById('waveform').classList.remove('active');
      document.getElementById('audio-progress-fill').style.width = '0%';
      document.getElementById('audio-time').textContent = '0:00';
      audioBlob = null; audioChunks = []; isRecording = false;
    }

    async function toggleRecord() {
      if (isRecording) stopRecording(); else await startRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioChunks = [];
        const mimeType = getSupportedMimeType();
        const options = mimeType ? { mimeType } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const mime = mediaRecorder.mimeType || mimeType || 'audio/webm';
          audioBlob = new Blob(audioChunks, { type: mime });
          const audioEl = document.getElementById('audio-playback');
          if (audioEl.src) URL.revokeObjectURL(audioEl.src);
          const url = URL.createObjectURL(audioBlob);
          audioEl.src = url; audioEl.load();
          audioEl.onloadedmetadata = () => { document.getElementById('audio-time').textContent = formatTime(audioEl.duration || 0); };
          audioEl.ontimeupdate = updateAudioProgress;
          audioEl.onended = () => { document.getElementById('play-icon').innerHTML = '<polygon points="5,3 19,12 5,21"/>'; };
          document.getElementById('answer-section').classList.add('visible');
          const q = questions[currentIndex];
          const list = document.getElementById('self-check-items');
          list.innerHTML = q.checks.map(c => `<li>${c}</li>`).join('');
          document.getElementById('self-check').style.display = 'block';
        };
        mediaRecorder.start(250);
        isRecording = true; recordSeconds = 0;
        document.getElementById('record-btn').className = 'btn-record recording';
        document.getElementById('btn-label').textContent = 'ឈប់ថត';
        document.getElementById('waveform').classList.add('active');
        document.getElementById('no-mic-msg').style.display = 'none';
        recordingInterval = setInterval(() => {
          recordSeconds++;
          const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
          document.getElementById('timer').textContent = `${m}:${String(s).padStart(2, '0')}`;
          if (recordSeconds >= 60) stopRecording();
        }, 1000);
      } catch (e) {
        console.error('Mic error:', e);
        document.getElementById('no-mic-msg').style.display = 'block';
      }
    }

    function stopRecording() {
      if (recordingInterval) { clearInterval(recordingInterval); recordingInterval = null; }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      isRecording = false;
      document.getElementById('record-btn').className = 'btn-record';
      document.getElementById('btn-label').textContent = 'ថតម្តងទៀត';
      document.getElementById('waveform').classList.remove('active');
    }

    function silentStopRecording() {
      if (recordingInterval) { clearInterval(recordingInterval); recordingInterval = null; }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { try { mediaRecorder.stop(); } catch (e) { } }
      isRecording = false;
    }

    function toggleAudioPlay() {
      const audio = document.getElementById('audio-playback');
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        document.getElementById('play-icon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } else {
        audio.pause();
        document.getElementById('play-icon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
      }
    }

    function stopAudio() {
      const audio = document.getElementById('audio-playback');
      audio.pause(); try { audio.currentTime = 0; } catch (e) { }
      document.getElementById('play-icon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
      document.getElementById('audio-progress-fill').style.width = '0%';
    }

    function updateAudioProgress() {
      const audio = document.getElementById('audio-playback');
      if (audio.duration) {
        document.getElementById('audio-progress-fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
        document.getElementById('audio-time').textContent = formatTime(audio.currentTime);
      }
    }

    function seekAudio(e) {
      const audio = document.getElementById('audio-playback');
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    function speakAnswer() {
      const q = questions[currentIndex];
      const btn = document.getElementById('btn-check');
      const label = document.getElementById('check-label');
      document.getElementById('model-answer-box').style.display = 'block';
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        btn.classList.remove('speaking'); label.textContent = 'ស្តាប់ចម្លើយគំរូ'; return;
      }
      const utter = new SpeechSynthesisUtterance(q.answer);
      utter.lang = 'ko-KR'; utter.rate = 0.65; utter.pitch = 1;
      const korVoice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('ko'));
      if (korVoice) utter.voice = korVoice;
      utter.onstart = () => { btn.classList.add('speaking'); label.textContent = 'កំពុងនិយាយ... (ចុចដើម្បីឈប់)'; };
      utter.onend = utter.onerror = () => { btn.classList.remove('speaking'); label.textContent = 'ស្តាប់ម្តងទៀត 🔁'; };
      window.speechSynthesis.speak(utter);
    }

    function speakQuestion() {
      const q = questions[currentIndex];
      const btn = document.getElementById('btn-speak');
      const label = document.getElementById('speak-label');
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel(); btn.classList.remove('speaking'); label.textContent = 'ស្តាប់សំណួរ'; return;
      }
      const utter = new SpeechSynthesisUtterance(q.prompt);
      utter.lang = 'ko-KR'; utter.rate = 0.65;
      const korVoice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('ko'));
      if (korVoice) utter.voice = korVoice;
      utter.onstart = () => { btn.classList.add('speaking'); label.textContent = 'កំពុងនិយាយ...'; };
      utter.onend = utter.onerror = () => { btn.classList.remove('speaking'); label.textContent = 'ស្តាប់សំណួរ'; };
      window.speechSynthesis.speak(utter);
    }

    function stopSpeech() {
      if (window.speechSynthesis?.speaking) window.speechSynthesis.cancel();
      const btn = document.getElementById('btn-check');
      if (btn) btn.classList.remove('speaking');
      const lbl = document.getElementById('check-label');
      if (lbl) lbl.textContent = 'ស្តាប់ចម្លើយគំរូ';
      const btnSpeak = document.getElementById('btn-speak');
      if (btnSpeak) btnSpeak.classList.remove('speaking');
      const speakLbl = document.getElementById('speak-label');
      if (speakLbl) speakLbl.textContent = 'ស្តាប់សំណួរ';
    }

    function navigate(dir) {
      const next = currentIndex + dir;
      if (next < 0 || next >= questions.length) return;
      currentIndex = next;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    renderQuestion();
  </script>
</body>

</html>
